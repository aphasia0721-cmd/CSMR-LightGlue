[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csmr-lightglue"
version = "0.1.0"
description = "Conditional Spatial Match Repair for LightGlue correspondences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["csmr*"]
